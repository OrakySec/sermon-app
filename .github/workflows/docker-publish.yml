name: Build, Push & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PORTAINER_URL: https://portainer.ykaromarques.com
  PORTAINER_STACK_ID: 19
  PORTAINER_ENDPOINT_ID: 1

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy-portainer:
    name: Redeploy Stack on Portainer
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Redeploy stack on Portainer
        run: |
          echo "📦 Sending updated stack to Portainer (Stack ID: ${{ env.PORTAINER_STACK_ID }})..."

          # Lê o docker-compose.yml e monta o payload JSON com ele
          STACK_CONTENT=$(cat docker-compose.yml | jq -Rs .)

          PAYLOAD=$(jq -n \
            --argjson stackFileContent "$STACK_CONTENT" \
            '{stackFileContent: $stackFileContent, prune: false, pullImage: true}')

          HTTP_STATUS=$(curl --silent --output /tmp/portainer_response.json \
            --write-out "%{http_code}" \
            --request PUT \
            --url "${{ env.PORTAINER_URL }}/api/stacks/${{ env.PORTAINER_STACK_ID }}?endpointId=${{ env.PORTAINER_ENDPOINT_ID }}" \
            --header "X-API-Key: ${{ secrets.PORTAINER_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/portainer_response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Portainer redeploy triggered successfully!"
          else
            echo "❌ Portainer redeploy failed with status $HTTP_STATUS"
            exit 1
          fi
