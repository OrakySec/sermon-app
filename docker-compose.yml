version: '3.8'

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # Aplicação Next.js (Sermon App)
  # ──────────────────────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/orakysec/sermon-app:latest
    networks:
      - YkaroNET
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=YkaroNET"
        - "traefik.http.routers.sermonapp.rule=Host(`sermon.ykaromarques.com`)"
        - "traefik.http.routers.sermonapp.entrypoints=websecure"
        - "traefik.http.routers.sermonapp.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.sermonapp.loadbalancer.server.port=3000"

networks:
  YkaroNET:
    external: true
