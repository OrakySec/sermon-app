version: "3.9"

# Docker Compose para PRODUÇÃO com Traefik
# Rede Traefik: YkaroNET
# Certresolver: letsencryptresolver
# Imagem hospedada no GitHub Container Registry (ghcr.io)

services:
  sermon-app:
    image: ghcr.io/orakysec/sermon-app:latest
    restart: always
    networks:
      - YkaroNET
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=YkaroNET"
        - "traefik.http.routers.sermon-app.rule=Host(`sermon.ykaromarques.com`)"
        - "traefik.http.routers.sermon-app.entrypoints=websecure"
        - "traefik.http.routers.sermon-app.tls=true"
        - "traefik.http.routers.sermon-app.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.sermon-app.tls.domains[0].main=sermon.ykaromarques.com"
        - "traefik.http.services.sermon-app.loadbalancer.server.port=3000"

networks:
  YkaroNET:
    external: true
